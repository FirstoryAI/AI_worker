# main에 합치면 EC2 개발 서버의 AI 워커를 다시 빌드한다. 스크립트와 설정은 Backend_Mainpage 저장소 deploy/ec2/deploy.sh, docs/deploy/ec2.md "자동 배포"
# GitHub OIDC로 AWS 역할을 받아 SSM Run Command로 서버의 Backend_Mainpage/deploy/ec2/deploy.sh ai를 실행한다. SSH 22번은 쓰지 않는다.
# 데모 중에는 저장소 변수 EC2_DEPLOY_ENABLED=false로 자동 배포를 끈다 (Actions 탭의 수동 실행은 된다)
name: EC2 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-ec2
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.EC2_DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      COMMAND: bash /home/ubuntu/firstory/Backend_Mainpage/deploy/ec2/deploy.sh ai
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: 서버에서 deploy.sh 실행 (SSM)
        run: |
          id=$(aws ssm send-command --instance-ids "$INSTANCE_ID" --document-name AWS-RunShellScript \
            --comment "$GITHUB_REPOSITORY ${GITHUB_SHA::7}" \
            --parameters "$(jq -nc --arg c "$COMMAND" '{commands: [$c], executionTimeout: ["1800"]}')" \
            --query Command.CommandId --output text)
          echo "SSM command: $id"
          while sleep 10; do
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "결과: $status"
          [ "$status" = Success ]
