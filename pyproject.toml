[project]
name = "firstory-pipeline"
version = "0.1.0"
description = "FIRSTORY AI 파이프라인 프로토타입 — LangGraph"
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
    "langchain-core>=0.3",
    "langsmith>=0.3",
    "openai>=1.60",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "pandas>=2.3.3",
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "boto3>=1.40",
]

[project.scripts]
firstory = "firstory.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/firstory"]
